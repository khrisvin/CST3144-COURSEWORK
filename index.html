<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>After-School Lessons</title>

    <!-- Load Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Load Font Awesome icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f7fa;
            color: #222;
        }

        #app {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            color: #2457a7;
        }

        /* Arrange the lesson cards in responsive columns. */
        .lesson-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .lesson {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
        }

        .lesson-icon {
            font-size: 40px;
            color: #2457a7;
        }

        .lesson h2 {
            margin-bottom: 15px;
        }

        .lesson p {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div id="app">

        <h1>{{ message }}</h1>
        <p>Explore our after-school classes and activities.</p>

        <div class="lesson-list">

            <!-- Repeat this card for every lesson in the array. -->
            <div
                v-for="lesson in lessons"
                v-bind:key="lesson.id"
                class="lesson">

                <!-- Each lesson has its own Font Awesome icon. -->
                <i
                    class="lesson-icon"
                    v-bind:class="lesson.icon"
                    aria-hidden="true">
                </i>

                <h2>{{ lesson.subject }}</h2>

                <p>Location: {{ lesson.location }}</p>
                <p>Price: Rs {{ lesson.price }}</p>
                <p>Spaces: {{ lesson.spaces }}</p>

            </div>

        </div>

    </div>

    <script>
        const { createApp } = Vue;

        const myApp = createApp({
            data() {
                return {
                    message: 'After-School Lessons',

                    // Sample lessons for our fictitious business.
                    lessons: [
                        {
                            id: 1001,
                            subject: 'Mathematics',
                            location: 'Curepipe',
                            price: 500,
                            spaces: 5,
                            icon: 'fa-solid fa-calculator'
                        },
                        {
                            id: 1002,
                            subject: 'English',
                            location: 'Mahebourg',
                            price: 400,
                            spaces: 5,
                            icon: 'fa-solid fa-book'
                        },
                        {
                            id: 1003,
                            subject: 'Science',
                            location: 'Rose Hill',
                            price: 600,
                            spaces: 5,
                            icon: 'fa-solid fa-flask'
                        },
                        {
                            id: 1004,
                            subject: 'French',
                            location: 'Quatre Bornes',
                            price: 450,
                            spaces: 5,
                            icon: 'fa-solid fa-language'
                        },
                        {
                            id: 1005,
                            subject: 'Computer Studies',
                            location: 'Port Louis',
                            price: 650,
                            spaces: 5,
                            icon: 'fa-solid fa-laptop'
                        },
                        {
                            id: 1006,
                            subject: 'Art',
                            location: 'Moka',
                            price: 350,
                            spaces: 5,
                            icon: 'fa-solid fa-palette'
                        },
                        {
                            id: 1007,
                            subject: 'Music',
                            location: 'Vacoas',
                            price: 550,
                            spaces: 5,
                            icon: 'fa-solid fa-music'
                        },
                        {
                            id: 1008,
                            subject: 'Football',
                            location: 'Plaine Magnien',
                            price: 300,
                            spaces: 5,
                            icon: 'fa-solid fa-futbol'
                        },
                        {
                            id: 1009,
                            subject: 'Drama',
                            location: 'Beau Bassin',
                            price: 400,
                            spaces: 5,
                            icon: 'fa-solid fa-masks-theater'
                        },
                        {
                            id: 1010,
                            subject: 'Chess',
                            location: 'Blue Bay',
                            price: 350,
                            spaces: 5,
                            icon: 'fa-solid fa-chess'
                        }
                    ]
                };
            }
        });

        myApp.mount('#app');
    </script>

</body>

</html>
